<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JECCY 新员工培训</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root {
            --jeccy-blue: #36497d;
            --jeccy-blue-light: #4f68b3;
            --jeccy-blue-soft: #6f8ad6;
            --bg-deep: #050712;
            --text-main: #f5f7ff;
            --text-sub: #a2aacb;
            --border-soft: rgba(255, 255, 255, 0.06);
            --glass: rgba(10, 13, 32, 0.92);
            --topbar-height: 56px;
            --dark: #0d1b3e;
            --dark2: #112050;
            --blue: #1a56db;
            --blue3: #60a5fa;
            --light: #e0f0ff;
            --white: #ffffff;
            --text-muted: #94b8d8;
            --card-bg: rgba(255,255,255,0.05);
            --card-border: rgba(96,165,250,0.18);
            --radius-sm: 8px;
        }
        html, body {
            height: 100%;
        }
        html{scroll-behavior:smooth;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
            background:
                radial-gradient(circle at 20% 0, rgba(102, 165, 255, 0.16), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(63, 117, 255, 0.22), transparent 55%),
                var(--bg-deep);
            color:var(--white);
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }
        ::-webkit-scrollbar{width:4px;}
        ::-webkit-scrollbar-track{background:var(--dark2);}
        ::-webkit-scrollbar-thumb{background:var(--blue3);border-radius:2px;}

        .topbar {
            position: relative;
            flex-shrink: 0;
            height: var(--topbar-height);
            padding: 0 16px;
            padding-top: env(safe-area-inset-top, 0px);
            background:
                radial-gradient(circle at 0 0, rgba(111, 170, 255, 0.46), transparent 55%),
                linear-gradient(120deg, #020518, #06081e 55%, #020310);
            border-bottom: 1px solid var(--border-soft);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            z-index: 2;
            max-width: 42%;
        }
        .brand-logo {
            flex-shrink: 0;
            margin-right: 10px;
            display: flex;
            align-items: center;
        }
        .brand-logo img {
            height: 28px;
            width: auto;
            display: block;
        }
        .brand-text-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .brand-text-sub {
            font-size: 10px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar-nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            display: flex;
            align-items: center;
            pointer-events: none;
        }
        .topbar-nav .nav-list {
            pointer-events: auto;
        }
        .nav-list {
            display: flex;
            list-style: none;
            gap: 8px;
        }
        .topbar-right {
            margin-left: auto;
            flex-shrink: 0;
            z-index: 2;
        }
        .topbar-tag {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(152, 177, 255, 0.65);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #d9e3ff;
            background: linear-gradient(120deg, rgba(89, 132, 255, 0.9), rgba(149, 196, 255, 0.7));
            box-shadow: 0 4px 18px rgba(3, 10, 53, 0.7);
            white-space: nowrap;
        }
        .nav-button {
            border: none;
            background: var(--glass);
            color: #dde1ff;
            padding: 7px 14px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.7);
            transition: all 0.18s ease-out;
            text-decoration: none;
        }
        .nav-button span.icon-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--jeccy-blue-soft), #cce4ff);
            box-shadow: 0 0 0 2px rgba(120, 163, 255, 0.5);
            flex-shrink: 0;
        }
        .nav-button span.badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(148, 184, 255, 0.6);
            color: #dce7ff;
            background: linear-gradient(120deg, rgba(76, 120, 255, 0.9), rgba(150, 199, 255, 0.9));
            flex-shrink: 0;
        }
        .nav-button:hover {
            background: rgba(19, 31, 76, 0.96);
            transform: translateY(-1px);
        }
        .nav-button.active {
            background: linear-gradient(135deg, var(--jeccy-blue), var(--jeccy-blue-light));
            color: #ffffff;
            box-shadow: 0 14px 32px rgba(6, 15, 59, 0.95), 0 0 0 1px rgba(189, 212, 255, 0.8);
        }
        .nav-button.active span.badge {
            color: var(--jeccy-blue);
            background: #f5f8ff;
            border-color: transparent;
        }

        .page-body {
            flex: 1;
            min-height: 0;
            display: flex;
        }
        .sidebar{
            width:280px;
            flex-shrink:0;
            background:var(--dark2);
            border-right:1px solid var(--card-border);
            padding:24px 16px;
            overflow-y:auto;
        }
        .menu-group{margin-bottom:24px;}
        .group-title{
            font-size:12px;text-transform:uppercase;letter-spacing:1.5px;
            color:var(--text-muted);margin-bottom:12px;padding-left:8px;
            font-weight:700;
        }
        .menu-item{
            display:flex;align-items:center;gap:8px;
            padding:12px 14px;border-radius:var(--radius-sm);
            color:var(--light);text-decoration:none;font-size:14px;
            margin-bottom:4px;cursor:pointer;transition:all 0.2s ease;
            user-select:none;
        }
        .menu-item:hover{background:var(--card-bg);color:var(--white);}
        .menu-item.active{background:var(--blue);color:var(--white);font-weight:600;}
        .menu-item.parent{font-weight:600;}
        .menu-item .arrow{
            margin-left:auto;font-size:10px;color:var(--text-muted);
            transition:transform 0.2s ease;flex-shrink:0;
        }
        .menu-item.parent.expanded .arrow{transform:rotate(90deg);}
        .submenu{
            max-height:0;overflow:hidden;
            transition:max-height 0.25s ease;
            padding-left:12px;
        }
        .submenu.open{max-height:800px;}
        .submenu-item{
            display:flex;align-items:flex-start;gap:8px;
            padding:9px 12px 9px 10px;border-radius:var(--radius-sm);
            color:var(--text-muted);font-size:12px;line-height:1.4;
            margin-bottom:2px;cursor:pointer;transition:all 0.2s ease;
            border-left:2px solid rgba(96,165,250,0.15);
        }
        .submenu-item:hover{background:var(--card-bg);color:var(--light);}
        .submenu-item.active{
            background:rgba(26,86,219,0.35);color:var(--white);
            border-left-color:var(--blue3);font-weight:500;
        }
        .submenu-item .file-icon{flex-shrink:0;font-size:13px;margin-top:1px;}
        .submenu-item .file-label{word-break:break-all;}
        .folder-placeholder{
            display:flex;align-items:center;justify-content:center;
            height:100%;color:var(--text-muted);font-size:14px;
            text-align:center;padding:24px;
        }

        .content-area{
            flex:1;
            min-width:0;
            min-height:0;
            display:flex;
            flex-direction:column;
            padding:24px;
            overflow:hidden;
            background:var(--dark);
        }
        .panel-header{
            flex-shrink:0;
            margin-bottom:16px;
        }
        .panel-title{font-size:18px;font-weight:600;color:var(--white);}
        .media-wrapper{
            flex:1;
            min-height:0;
            background:#000;
            border-radius:var(--radius-sm);
            overflow:hidden;
            border:1px solid var(--card-border);
        }
        .media-wrapper video, .media-wrapper iframe {
            width:100%;height:100%;object-fit:contain;border:none;
        }
        .media-wrapper.is-pdf {
            min-height: 420px;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 40px;
            height: 40px;
            margin-right: 8px;
            padding: 8px;
            border: 1px solid rgba(148, 184, 255, 0.35);
            border-radius: 10px;
            background: var(--glass);
            cursor: pointer;
            flex-shrink: 0;
            z-index: 3;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-toggle-bar {
            display: block;
            width: 100%;
            height: 2px;
            border-radius: 2px;
            background: #dce7ff;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        body.sidebar-open .menu-toggle-bar:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        body.sidebar-open .menu-toggle-bar:nth-child(2) {
            opacity: 0;
        }
        body.sidebar-open .menu-toggle-bar:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 1024px) {
            .sidebar { width: 240px; }
        }

        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .topbar {
                position: sticky;
                top: 0;
                flex-wrap: wrap;
                height: auto;
                min-height: var(--topbar-height);
                padding-top: calc(8px + env(safe-area-inset-top, 0px));
                padding-bottom: 8px;
                gap: 8px;
                z-index: 120;
            }
            .topbar-brand {
                max-width: none;
                flex: 1;
                min-width: 0;
            }
            .brand-text-sub { white-space: normal; line-height: 1.35; }
            .topbar-nav {
                position: static;
                transform: none;
                order: 3;
                width: 100%;
                justify-content: center;
                pointer-events: auto;
            }
            .topbar-nav .nav-list {
                width: 100%;
                justify-content: stretch;
                gap: 6px;
            }
            .topbar-nav .nav-list li { flex: 1; }
            .nav-button {
                width: 100%;
                justify-content: center;
                padding: 8px 10px;
                font-size: 12px;
            }
            .nav-button span.badge { display: none; }
            .topbar-tag { font-size: 9px; padding: 3px 8px; }

            .sidebar-backdrop {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 90;
                background: rgba(2, 5, 20, 0.65);
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.25s ease, visibility 0.25s;
            }
            body.sidebar-open .sidebar-backdrop {
                opacity: 1;
                visibility: visible;
            }

            .page-body { position: relative; }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: min(300px, 88vw);
                height: 100%;
                height: 100dvh;
                max-height: none;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
                border-right: 1px solid var(--card-border);
                padding-top: calc(var(--topbar-height) + env(safe-area-inset-top, 0px) + 12px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                box-shadow: 8px 0 32px rgba(0, 0, 0, 0.45);
            }
            body.sidebar-open .sidebar {
                transform: translateX(0);
            }

            .content-area {
                width: 100%;
                padding: 14px 16px;
                padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            }
            .panel-title { font-size: 16px; }
            .media-wrapper {
                flex: none;
                aspect-ratio: 16 / 9;
                min-height: 180px;
            }
            .media-wrapper.is-pdf {
                aspect-ratio: auto;
                flex: 1;
                min-height: 55vh;
            }
            .menu-item { min-height: 44px; }
            .submenu-item { min-height: 40px; }
            .sidebar { -webkit-overflow-scrolling: touch; }
        }

        @media (max-width: 480px) {
            .brand-text-sub { display: none; }
            .brand-logo img { height: 24px; }
            .content-area { padding: 12px; }
        }

        @media (min-width: 769px) {
            body.sidebar-open { overflow: auto; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="打开导航菜单" aria-controls="sidebarMenu" aria-expanded="false">
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
        </button>

        <div class="topbar-brand">
            <div class="brand-logo">
                <img src="logo.png" alt="JECCY Logo" />
            </div>
            <div class="brand-text-block">
                <div class="brand-text-sub">Enterprise Knowledge &amp; Training Console</div>
            </div>
        </div>

        <nav class="topbar-nav" aria-label="主导航">
            <ul class="nav-list">
                <li>
                    <a href="JECCY_培训学院.html" class="nav-button active">
                        <span class="icon-dot"></span>
                        <span class="label">培训学院</span>
                        <span class="badge">Academy</span>
                    </a>
                </li>
                <li>
                    <a href="JECCY_企业信息库.html" class="nav-button">
                        <span class="icon-dot"></span>
                        <span class="label">企业信息库</span>
                        <span class="badge">Information</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="topbar-right">
            <div class="topbar-tag">JECCY · Admin</div>
        </div>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <div class="page-body">
        <aside class="sidebar" id="sidebarMenu" aria-label="课程目录"></aside>

        <div class="content-area">
            <div class="panel-header">
                <div class="panel-title" id="currentTitle">正在加载...</div>
            </div>
            <div class="media-wrapper" id="mediaContainer"></div>
        </div>
    </div>

    <script>
        const localData = {
          "categories": [
            {
              "id": "module_1",
              "name": "模块一：入职必修",
              "items": [
                { "id": "v1", "title": "公司简介宣传片", "type": "video", "path": "media/d1-Jeccy_Dongguan_Promo_202410.mp4" },
                { "id": "d2", "title": "员工手册", "type": "pdf", "path": "media/d2-Employee_Manual_CN.pdf" },
                { "id": "d1", "title": "组织架构", "type": "pdf", "path": "media/d4-Jeccy_Org_Chart.pdf" },
                { "id": "d3", "title": "业务流程", "type": "pdf", "path": "media/d5-Jeccy_Business_Process_CNEN_1007.pdf" }
              ]
            },
            {
              "id": "module_2",
              "name": "模块二：业务培训",
              "items": [
                { "id": "d7", "title": "高效沟通", "type": "pdf", "path": "media/a-Efficient Communication Training.pdf" },
                {
                  "id": "d4",
                  "title": "产品工艺知识",
                  "children": [
                    { "id": "b1", "title": "1-包包部位名称中英文.xls", "type": "pdf", "path": "media/b1-Bag_Part_Name_ENCN.pdf" },
                    { "id": "b2", "title": "2-包包工艺.docx", "type": "pdf", "path": "media/b2-Bag_Production_Process.pdf" },
                    { "id": "b3", "title": "3-手袋车缝工艺标准.docx", "type": "pdf", "path": "media/b3-Handbag_Sewing_Standard.pdf" },
                    { "id": "b4", "title": "4-皮具工艺生产流程.doc", "type": "pdf", "path": "media/b4-Leather_Production_Flow.pdf" },
                    { "id": "b5", "title": "5-手袋制作工艺.pdf", "type": "pdf", "path": "media/b5-Handbag_Manufacture_Craft.pdf" },
                    { "id": "b6", "title": "6-手袋的制作流程.pptx", "type": "pdf", "path": "media/b6-Handbag_Making_Process.pdf" },
                    { "id": "b7", "title": "7-手袋出格技术指导.pdf", "type": "pdf", "path": "media/b7-Handbag_Pattern_Guide.pdf" },
                    { "id": "b8", "title": "8-手袋各部位的专业名称.pptx", "type": "pdf", "path": "media/b8-Handbag_Part_Terms.pdf" },
                    { "id": "b9", "title": "9-箱包PU面料知识点.pdf", "type": "pdf", "path": "media/b9-Case_PU_Fabric_Knowledge.pdf" },
                    { "id": "b10", "title": "10-捷希手机壳等产品工艺 V1.0.docx", "type": "pdf", "path": "media/b10-Jexi_PhoneCase_Craft_V1.0.pdf" }
                  ]
                },
                {
                  "id": "d5",
                  "title": "环保测试知识",
                  "children": [
                    { "id": "c0", "title": "产品测试试卷", "type": "folder" },
                    { "id": "c2", "title": "产品测试题及答案.docx", "type": "pdf", "path": "media/c2-Jeccy_Product_Test_QA.pdf" },
                    { "id": "c1", "title": "cJeccy_Environmental_Testing.pptx", "type": "pdf", "path": "media/c1Jeccy_Environmental_Test_Training.pdf" }
                  ]
                }
              ]
            }
          ]
        };

        const sidebar = document.getElementById('sidebarMenu');
        const currentTitle = document.getElementById('currentTitle');
        const mediaContainer = document.getElementById('mediaContainer');
        const menuToggle = document.getElementById('menuToggle');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const MOBILE_MQ = window.matchMedia('(max-width: 768px)');

        function isMobileLayout() {
            return MOBILE_MQ.matches;
        }

        function setSidebarOpen(open) {
            document.body.classList.toggle('sidebar-open', open);
            menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            sidebarBackdrop.setAttribute('aria-hidden', open ? 'false' : 'true');
            document.body.style.overflow = open && isMobileLayout() ? 'hidden' : '';
        }

        function closeMobileSidebar() {
            if (isMobileLayout()) setSidebarOpen(false);
        }

        menuToggle.addEventListener('click', () => setSidebarOpen(!document.body.classList.contains('sidebar-open')));
        sidebarBackdrop.addEventListener('click', closeMobileSidebar);
        MOBILE_MQ.addEventListener('change', () => {
            if (!isMobileLayout()) setSidebarOpen(false);
        });

        function getFileIcon(item) {
            if (item.type === 'folder') return '📁';
            const name = item.title || '';
            if (/\.xls/i.test(name)) return '📊';
            if (/\.doc/i.test(name)) return '📝';
            if (/\.pdf/i.test(name)) return '📄';
            if (/\.ppt/i.test(name)) return '📽';
            if (item.type === 'video') return '▶';
            return '📄';
        }

        function clearActive() {
            document.querySelectorAll('.menu-item.active, .submenu-item.active').forEach(el => {
                el.classList.remove('active');
            });
        }

        function activateItem(element, item) {
            clearActive();
            element.classList.add('active');
            switchContent(item);
            closeMobileSidebar();
        }

        function renderSubmenuItem(item, parentEl) {
            const subItem = document.createElement('div');
            subItem.className = 'submenu-item';
            subItem.innerHTML = `<span class="file-icon">${getFileIcon(item)}</span><span class="file-label">${item.title}</span>`;

            subItem.addEventListener('click', (e) => {
                e.stopPropagation();
                activateItem(subItem, item);
            });

            parentEl.appendChild(subItem);
            return subItem;
        }

        function renderMenu(data) {
            sidebar.innerHTML = '';
            let firstLeaf = null;

            data.categories.forEach(category => {
                const group = document.createElement('div');
                group.className = 'menu-group';

                const title = document.createElement('div');
                title.className = 'group-title';
                title.innerText = category.name;
                group.appendChild(title);

                category.items.forEach(item => {
                    if (item.children && item.children.length) {
                        const menuItem = document.createElement('div');
                        menuItem.className = 'menu-item parent';
                        menuItem.innerHTML = `<span>${item.title}</span><span class="arrow">▶</span>`;

                        const submenu = document.createElement('div');
                        submenu.className = 'submenu';

                        item.children.forEach(child => {
                            const subEl = renderSubmenuItem(child, submenu);
                            if (!firstLeaf) firstLeaf = { element: subEl, data: child, parent: menuItem, submenu };
                        });

                        menuItem.addEventListener('click', () => {
                            const isOpen = submenu.classList.contains('open');
                            document.querySelectorAll('.submenu.open').forEach(el => el.classList.remove('open'));
                            document.querySelectorAll('.menu-item.parent.expanded').forEach(el => el.classList.remove('expanded'));
                            if (!isOpen) {
                                submenu.classList.add('open');
                                menuItem.classList.add('expanded');
                            }
                        });

                        group.appendChild(menuItem);
                        group.appendChild(submenu);
                    } else {
                        const menuItem = document.createElement('div');
                        menuItem.className = 'menu-item';
                        menuItem.innerText = item.title;

                        if (!firstLeaf) firstLeaf = { element: menuItem, data: item };

                        menuItem.addEventListener('click', () => activateItem(menuItem, item));
                        group.appendChild(menuItem);
                    }
                });

                sidebar.appendChild(group);
            });

            if (firstLeaf) {
                if (firstLeaf.parent && firstLeaf.submenu) {
                    firstLeaf.parent.classList.add('expanded');
                    firstLeaf.submenu.classList.add('open');
                }
                firstLeaf.element.classList.add('active');
                switchContent(firstLeaf.data);
            }
        }

        function switchContent(item) {
            currentTitle.innerText = item.title;
            mediaContainer.innerHTML = '';
            mediaContainer.classList.toggle('is-pdf', item.type === 'pdf');

            if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.path;
                video.controls = true;
                video.autoplay = true;
                mediaContainer.appendChild(video);
            } else if (item.type === 'pdf') {
                const iframe = document.createElement('iframe');
                iframe.src = item.path;
                mediaContainer.appendChild(iframe);
            } else if (item.type === 'folder') {
                const placeholder = document.createElement('div');
                placeholder.className = 'folder-placeholder';
                placeholder.innerHTML = '📁 产品测试试卷文件夹<br><span style="font-size:12px;margin-top:8px;display:block;opacity:0.7;">请联系管理员上传试卷文件</span>';
                mediaContainer.appendChild(placeholder);
            }
        }

        fetch('data.json')
            .then(res => res.json())
            .then(data => renderMenu(data))
            .catch(() => renderMenu(localData));
    </script>
</body>
</html>
